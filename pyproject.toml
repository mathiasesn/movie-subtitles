[project]
name = "movie-subtitles"
version = "0.1.2"
description = "Command line interface to transcribe movies"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mathiasesn", email = "mathiasesn1@gmail.com" }]
dependencies = [
    "tqdm",
    "faster-whisper",
    "transformers",
    "torch",
    # providers/local.py passes device_map= to from_pretrained, which transformers
    # only accepts when accelerate is installed. --engine local cannot translate
    # without it.
    "accelerate",
    "elevenlabs",
    "anthropic",
    "openai",
    # main() loads .env before building any provider, so the API keys can live in a
    # gitignored file instead of being exported into every shell.
    "python-dotenv",
    # speaker-voice classifier: noise-robust F0 estimation via librosa's pyin.
    "librosa",
    # speaker-voice classifier: Praat-based formant tracking (F1/F2).
    "praat-parselmouth",
    # voices.py:classify_voice imports numpy directly (np.isnan/np.median over the
    # librosa/parselmouth outputs); it currently resolves transitively via librosa,
    # but a directly-imported package must be declared per this repo's convention
    # (see the accelerate entry above).
    "numpy",
    # separate.py's --separate-background path: Demucs source separation
    # (vocals/accompaniment stems) for mux.py to mix the dub over.
    "demucs",
    # separate.py imports torchaudio directly (wav load/save around the Demucs call);
    # it resolves transitively via demucs, but per this repo's convention (see the
    # numpy entry above) a directly-imported package must be declared explicitly.
    "torchaudio",
]

[project.urls]
Homepage = "https://github.com/mathiasesn/movie-subtitles"
Repository = "https://github.com/mathiasesn/movie-subtitles"

[project.scripts]
movie-subtitles = "movie_subtitles.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]
