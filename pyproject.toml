[project]
name = "movie-subtitles"
version = "0.1.2"
description = "Command line interface to transcribe movies"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mathiasesn", email = "mathiasesn1@gmail.com" }]
dependencies = [
    "tqdm",
    "faster-whisper",
    "transformers",
    "torch",
    # providers/local.py passes device_map= to from_pretrained, which transformers
    # only accepts when accelerate is installed. --engine local cannot translate
    # without it.
    "accelerate",
    "elevenlabs",
    "anthropic",
    "openai",
    # main() loads .env before building any provider, so the API keys can live in a
    # gitignored file instead of being exported into every shell.
    "python-dotenv",
    # speaker-voice classifier: noise-robust F0 estimation via librosa's pyin.
    "librosa",
    # speaker-voice classifier: Praat-based formant tracking (F1/F2).
    "praat-parselmouth",
    # voices.py:classify_voice imports numpy directly (np.isnan/np.median over the
    # librosa/parselmouth outputs); it currently resolves transitively via librosa,
    # but a directly-imported package must be declared per this repo's convention
    # (see the accelerate entry above).
    "numpy",
    # separate.py's --separate-background path: Demucs source separation
    # (vocals/accompaniment stems) for mux.py to mix the dub over. separate.py goes
    # through demucs.api.Separator, which owns the decode and the write too, so no
    # separate audio-I/O library is needed alongside it.
    "demucs",
    # local/openai ASR speaker diarisation: pyannote's speaker-diarization-community-1
    # pipeline. Floored at 4.0 because unconstrained resolution picks 3.4.0, which
    # cannot load that pipeline. This floor collapses the lock's two-branch torch pin
    # (2.2.2 for x86_64 macOS, 2.13.0 elsewhere) down to torch 2.13.0 only, which has
    # no x86_64 macOS wheel -- Intel Mac support is deliberately dropped as a result.
    "pyannote.audio>=4.0",
]

[project.urls]
Homepage = "https://github.com/mathiasesn/movie-subtitles"
Repository = "https://github.com/mathiasesn/movie-subtitles"

[project.scripts]
movie-subtitles = "movie_subtitles.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Both build targets are stated explicitly rather than left to hatchling's
# auto-detection. The wheel is the package and nothing else: scripts/ is a
# developer tool (it parses the [measure] logs behind cli.py's budget
# constants) and must never land in a `uv tool install movie-subtitles`.
[tool.hatch.build.targets.wheel]
packages = ["movie_subtitles"]

# The sdist needs an explicit exclude list because hatchling does not honour
# the nested specs/.gitignore -- without this, local design notes and
# measurement data that are deliberately untracked get published to PyPI.
[tool.hatch.build.targets.sdist]
exclude = [
    "/scripts",
    "/specs",
    "/data",
    "/.github",
    "/.claude",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]
