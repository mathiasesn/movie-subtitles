name: Feature request
description: Suggest a new capability or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen instead? Include CLI flags or output shape if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - ASR / transcription
        - Translation
        - TTS / dubbing
        - SRT output
        - CLI / configuration
        - Managed dubbing (--managed)
        - Docs
        - Other
    validations:
      required: true
